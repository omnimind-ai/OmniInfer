name: Main Platform CI

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  main-platform-check:
    name: Main Platform Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Keep the normal target below three minutes while allowing one minute
    # for transient hosted-runner and cache variance.
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run platform unit tests
        run: cargo test --locked --workspace --lib --bins

      - name: Validate README product entry
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest tests/test_readme.py

      - name: Validate model catalog assets
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest tests/test_model_catalog_assets.py

      - name: Test Unix installer contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/test_release_installer.sh
          bash tests/test_source_installer.sh

      - name: Test Linux source installer helpers
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/test_install_deps.sh

      - name: Test Windows installer contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\tests\test_release_installer.ps1
          .\tests\test_source_installer.ps1
